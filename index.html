<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мой ИИ</title>
    <meta name="theme-color" content="#ffffff">
    <script>
        // Применяем тему и шрифт до отрисовки, чтобы не было мигания
        (function () {
            var theme = "system", font = "serif";
            try {
                var s = JSON.parse(localStorage.getItem("myai-settings")) || {};
                theme = s.theme || theme;
                font = s.font || font;
            } catch (e) {}
            var dark = theme === "dark" ||
                (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            document.documentElement.setAttribute("data-font", font);
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cg fill='%23fff' transform='translate(4 4) scale(.667)'%3E%3Cpath d='M12 .5C12.9 7.6 16.4 11.1 23.5 12 16.4 12.9 12.9 16.4 12 23.5 11.1 16.4 7.6 12.9 .5 12 7.6 11.1 11.1 7.6 12 .5Z'/%3E%3Cpath transform='rotate(45 12 12)' d='M12 4.5C12.4 9.2 14.8 11.6 19.5 12 14.8 12.4 12.4 14.8 12 19.5 11.6 14.8 9.2 12.4 4.5 12 9.2 11.6 11.6 9.2 12 4.5Z'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Логотип: восьмилучевая звезда -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="logo" viewBox="0 0 24 24">
            <path d="M12 .5C12.9 7.6 16.4 11.1 23.5 12 16.4 12.9 12.9 16.4 12 23.5 11.1 16.4 7.6 12.9 .5 12 7.6 11.1 11.1 7.6 12 .5Z"/>
            <path transform="rotate(45 12 12)" d="M12 4.5C12.4 9.2 14.8 11.6 19.5 12 14.8 12.4 12.4 14.8 12 19.5 11.6 14.8 9.2 12.4 4.5 12 9.2 11.6 11.6 9.2 12 4.5Z"/>
        </symbol>
    </svg>

    <div class="layout" id="layout">

        <!-- Боковая панель -->
        <aside class="sidebar" id="sidebar">
            <div class="sb-top">
                <button id="collapse-btn" class="icon-btn" type="button" aria-label="Свернуть панель" title="Свернуть панель">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
                </button>
                <div class="sb-brand">
                    <span class="star"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#logo"/></svg></span>
                    <span id="brand-name">Мой ИИ</span>
                </div>
            </div>

            <button id="new-chat-btn" class="sb-new" type="button">
                <span class="sb-new-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <span>Новый чат</span>
            </button>

            <label class="search">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="search-input" type="search" placeholder="Поиск по чатам" autocomplete="off">
            </label>

            <div id="chat-list" class="chat-list" aria-label="История чатов"></div>

            <button id="settings-btn" class="profile" type="button">
                <span class="profile-avatar" id="profile-avatar">Я</span>
                <span class="profile-text">
                    <span id="profile-name">Гость</span>
                    <small>Настройки</small>
                </span>
            </button>
        </aside>

        <div class="overlay" id="overlay"></div>

        <!-- Основная часть -->
        <main class="main empty" id="main">
            <header class="topbar">
                <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Открыть панель" title="Открыть панель">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
                </button>
                <div id="chat-title" class="chat-title"></div>
                <div class="menu-wrap">
                    <button id="more-btn" class="icon-btn" type="button" aria-label="Действия с чатом" hidden>
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
                    </button>
                    <div id="more-menu" class="popover" hidden>
                        <button type="button" data-action="rename">Переименовать</button>
                        <button type="button" data-action="export">Экспорт в Markdown</button>
                        <button type="button" data-action="delete" class="danger">Удалить</button>
                    </div>
                </div>
            </header>

            <div class="stage">
                <div id="welcome" class="welcome">
                    <div class="welcome-star"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#logo"/></svg></div>
                    <h1 id="greeting">Здравствуйте</h1>
                </div>

                <div id="chat" class="chat-scroll">
                    <div id="thread" class="thread"></div>
                </div>

                <button id="scroll-down" class="scroll-down" type="button" aria-label="Прокрутить вниз" hidden>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
                </button>

                <div class="composer-wrap">
                    <form id="chat-form" class="composer" autocomplete="off">
                        <textarea id="message-input" rows="1" maxlength="4000" placeholder="Чем я могу помочь вам сегодня?"></textarea>
                        <div class="composer-row">
                            <span id="char-count" class="char-count"></span>
                            <button id="send-btn" class="send-btn" type="submit" aria-label="Отправить"></button>
                        </div>
                    </form>

                    <div id="starters" class="starters">
                        <button class="chip" type="button" data-prompt="Помоги мне написать ">Написать</button>
                        <button class="chip" type="button" data-prompt="Объясни простыми словами ">Узнать</button>
                        <button class="chip" type="button" data-prompt="Помоги с кодом: ">Код</button>
                        <button class="chip" type="button" data-prompt="Предложи идеи для ">Идеи</button>
                    </div>

                    <p class="disclaimer">ИИ может ошибаться. Проверяйте важную информацию.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Универсальный диалог (переименование, подтверждения) -->
    <dialog id="dialog" class="dialog">
        <form id="dialog-form">
            <h2 id="dialog-title"></h2>
            <p id="dialog-text" class="dialog-text"></p>
            <input id="dialog-input" class="field" type="text" maxlength="80">
            <div class="dialog-actions">
                <button type="button" id="dialog-cancel" class="btn">Отмена</button>
                <button type="submit" id="dialog-ok" class="btn primary">OK</button>
            </div>
        </form>
    </dialog>

    <!-- Настройки -->
    <dialog id="settings-dialog" class="dialog wide">
        <div class="dialog-head">
            <h2>Настройки</h2>
            <button id="settings-close" class="icon-btn" type="button" aria-label="Закрыть">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <div class="settings-body">
            <div class="form-group">
                <label for="set-name">Как к вам обращаться</label>
                <input id="set-name" class="field" type="text" maxlength="40" placeholder="Ваше имя">
            </div>

            <div class="form-group">
                <label for="set-instructions">Инструкции для ИИ</label>
                <textarea id="set-instructions" class="field" rows="4" maxlength="2000" placeholder="Например: отвечай кратко и по-деловому"></textarea>
                <small>Отправляются на сервер вместе с каждым запросом как системный промпт.</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="set-theme">Тема</label>
                    <select id="set-theme" class="field">
                        <option value="system">Как в системе</option>
                        <option value="light">Светлая</option>
                        <option value="dark">Тёмная</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="set-font">Шрифт ответов</label>
                    <select id="set-font" class="field">
                        <option value="serif">С засечками</option>
                        <option value="sans">Без засечек</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Данные</label>
                <div class="btn-row">
                    <button id="export-all-btn" class="btn" type="button">Экспорт всех чатов</button>
                    <button id="import-btn" class="btn" type="button">Импорт</button>
                    <button id="delete-all-btn" class="btn danger-outline" type="button">Удалить все чаты</button>
                </div>
                <input id="import-file" type="file" accept="application/json,.json" hidden>
                <small>Чаты хранятся в этом браузере. Горячая клавиша: Ctrl+Shift+O — новый чат.</small>
            </div>
        </div>

        <div class="dialog-actions">
            <button id="settings-done" class="btn primary" type="button">Готово</button>
        </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
